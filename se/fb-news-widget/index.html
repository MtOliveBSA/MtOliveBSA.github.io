<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOBSA Facebook News Feed</title>
  <style>
    :root {
      --mobsa-red: #e31d24;
      --text: #222;
      --muted: #666;
      --card-bg: #fff;
      --page-bg: #f3f3f3;
      --border: #ddd;
      --shadow: 0 2px 10px rgba(0,0,0,.06);
      --radius: 10px;
      --feed-max: 5;
      --image-height: 240px;
      --font: Arial, Helvetica, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page-bg);
      color: var(--text);
      font-family: var(--font);
    }

    .news-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px;
    }

    .news-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .news-header h2 {
      margin: 0;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: .02em;
      text-transform: uppercase;
    }

    .news-header a {
      color: var(--mobsa-red);
      text-decoration: none;
      font-weight: 700;
    }

    .feed {
      display: grid;
      gap: 18px;
    }

    .card {
      display: grid;
      grid-template-columns: minmax(220px, 320px) 1fr;
      gap: 18px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .media {
      position: relative;
      min-height: var(--image-height);
      background: #e9e9e9;
    }

    .media img,
    .media video,
    .media iframe {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border: 0;
    }

    .media--placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: .95rem;
      padding: 18px;
      text-align: center;
    }

    .play-badge {
      position: absolute;
      right: 10px;
      bottom: 10px;
      background: rgba(0,0,0,.7);
      color: #fff;
      font-size: .8rem;
      font-weight: 700;
      padding: 6px 8px;
      border-radius: 999px;
    }

    .content {
      padding: 18px 18px 18px 0;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .meta {
      color: var(--muted);
      font-size: .92rem;
      margin-bottom: 10px;
    }

    .text {
      font-size: 1rem;
      line-height: 1.55;
      white-space: pre-line;
      margin-bottom: 16px;
      overflow-wrap: anywhere;
    }

    .actions {
      margin-top: auto;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border-radius: 4px;
      min-height: 42px;
      padding: 0 16px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .02em;
      font-size: .92rem;
      transition: transform .15s ease, opacity .15s ease;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn--primary {
      background: var(--mobsa-red);
      color: #fff;
    }

    .btn--ghost {
      border: 1px solid var(--border);
      color: var(--text);
      background: #fff;
    }

    .status {
      background: #fff;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 18px;
      color: var(--muted);
    }

    @media (max-width: 820px) {
      .card { grid-template-columns: 1fr; }
      .content { padding: 0 16px 16px; }
      .media { min-height: 220px; }
    }
  </style>
</head>
<body>
  <section class="news-wrap" aria-labelledby="recent-news-title">
    <div class="news-header">
      <h2 id="recent-news-title">Recent News</h2>
      <a href="https://www.facebook.com/mtolivebaseballsoftball" target="_blank" rel="noopener noreferrer">View Facebook Page</a>
    </div>

    <div id="feed" class="feed" aria-live="polite">
      <div class="status">Loading latest Facebook posts…</div>
    </div>
  </section>

  <script>
    /**
     * CONFIG
     * maxPosts: how many posts to show.
     * dataUrl: path to JSON generated by GitHub Action or another server-side job.
     * showVideoPreview: if true and an embeddable video URL exists, render it in an iframe.
     */
    window.FB_NEWS_CONFIG = {
      maxPosts: 5,
      dataUrl: './fb-posts.json',
      showVideoPreview: false,
      fallbackPageUrl: 'https://www.facebook.com/mtolivebaseballsoftball'
    };
  </script>

  <script>
    (function () {
      const cfg = window.FB_NEWS_CONFIG || {};
      const maxPosts = Number(cfg.maxPosts || 5);
      const feedEl = document.getElementById('feed');

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function formatDate(value) {
        if (!value) return '';
        const d = new Date(value);
        if (Number.isNaN(d.getTime())) return '';
        return d.toLocaleString(undefined, {
          year: 'numeric',
          month: 'numeric',
          day: 'numeric',
          hour: 'numeric',
          minute: '2-digit'
        });
      }

      function truncate(text, maxLen) {
        const clean = String(text || '').trim();
        if (clean.length <= maxLen) return clean;
        return clean.slice(0, maxLen).trim() + '…';
      }

      function renderMedia(post) {
        if (cfg.showVideoPreview && post.video_embed_url) {
          return `
            <div class="media">
              <iframe
                src="${escapeHtml(post.video_embed_url)}"
                loading="lazy"
                allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"
                allowfullscreen
                title="Facebook video preview">
              </iframe>
            </div>`;
        }

        if (post.image) {
          return `
            <div class="media">
              <img src="${escapeHtml(post.image)}" alt="Facebook post media" loading="lazy" />
              ${post.is_video ? '<span class="play-badge">Video</span>' : ''}
            </div>`;
        }

        return `<div class="media media--placeholder"><div>No preview media for this post.</div></div>`;
      }

      function renderPost(post) {
        const message = truncate(post.message || post.story || 'View this update on Facebook.', 320);
        const created = formatDate(post.created_time);
        const url = post.permalink_url || cfg.fallbackPageUrl || '#';

        return `
          <article class="card">
            ${renderMedia(post)}
            <div class="content">
              <div class="meta">By MOBSA • ${escapeHtml(created)}</div>
              <div class="text">${escapeHtml(message)}</div>
              <div class="actions">
                <a class="btn btn--primary" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">Read More</a>
                <a class="btn btn--ghost" href="${escapeHtml(cfg.fallbackPageUrl || url)}" target="_blank" rel="noopener noreferrer">Facebook Page</a>
              </div>
            </div>
          </article>`;
      }

      async function loadFeed() {
        try {
          const res = await fetch(cfg.dataUrl, { cache: 'no-store' });
          if (!res.ok) throw new Error('Failed to load feed JSON');
          const json = await res.json();
          const posts = Array.isArray(json.data) ? json.data.slice(0, maxPosts) : [];

          if (!posts.length) {
            feedEl.innerHTML = `<div class="status">No recent Facebook posts were found.</div>`;
            return;
          }

          feedEl.innerHTML = posts.map(renderPost).join('');
        } catch (err) {
          console.error(err);
          feedEl.innerHTML = `
            <div class="status">
              Unable to load Facebook posts right now.
              <div style="margin-top:10px;">
                <a class="btn btn--primary" href="${escapeHtml(cfg.fallbackPageUrl || '#')}" target="_blank" rel="noopener noreferrer">Open Facebook Page</a>
              </div>
            </div>`;
        }
      }

      loadFeed();
    })();
  </script>
</body>
</html>
